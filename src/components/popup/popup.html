<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header matching modifier box style -->
      <div class="popup-header">
        <img src="" alt="Pixels Roll20" class="popup-icon" />
        <span class="popup-title">Pixels Roll20</span>
      </div>

      <!-- Content area -->
      <div class="popup-content">
        <!-- Roll mode controls -->
        <div class="modifier-section">
          <div class="toggle-container">
            <label class="toggle-label">
              <input type="checkbox" id="allowUnprompted" checked />
              <span class="toggle-text">Allow unprompted rolls</span>
            </label>
          </div>
          <div class="roll-window-container" id="rollWindowContainer">
            <label class="roll-window-label">
              Roll window:
              <span id="rollWindowValue" class="roll-window-value">2</span>s
            </label>
            <input
              type="range"
              id="rollWindowSlider"
              class="roll-window-slider"
              min="1"
              max="10"
              value="2"
              step="1"
            />
          </div>
          <div class="toggle-container">
            <label class="toggle-label">
              <input type="checkbox" id="allowDiceSubstitution" />
              <span class="toggle-text"
                >Allow d8, d12 and d20 as d4, d6 and d10</span
              >
            </label>
          </div>
          <div class="button-container" id="savedRollsButtons">
            <label class="toggle-label">
              <input type="checkbox" id="toggleSavedRolls" checked />
              <span class="toggle-text">Display Saved Roll Formulas</span>
            </label>
          </div>
        </div>

        <!-- Profiles -->
        <div class="profiles-section" id="profilesSection">
          <div class="section-label">Saved Profiles</div>

          <div
            id="activeProfileBanner"
            class="active-profile-banner"
            style="display: none"
          >
            <span class="active-profile-label"
              >Active: <span id="activeProfileName"></span
            ></span>
            <button
              id="updateProfile"
              class="profile-item-btn"
              title="Save current popout into the active profile"
            >
              Update ↻
            </button>
          </div>

          <div class="profile-save-row">
            <input
              id="profileName"
              type="text"
              class="profile-input"
              placeholder="Profile name"
              maxlength="40"
            />
            <button id="saveProfile" class="primary-button profile-save-btn">
              Save
            </button>
          </div>
          <ul id="profileList" class="profile-list"></ul>
          <div id="profileEmpty" class="text-small text-muted">
            No saved profiles yet.
          </div>

          <div class="profile-io-row">
            <button id="exportProfiles" class="secondary-button">
              Export All
            </button>
            <button id="importProfiles" class="secondary-button">Import</button>
            <input
              id="importFile"
              type="file"
              accept="application/json,.json"
              style="display: none"
            />
          </div>
        </div>

        <!-- Connection section -->
        <div class="connection-section">
          <div
            id="knownDiceSection"
            class="known-dice-section"
            style="display: none"
          >
            <div class="section-label">
              Known Dice
              <span id="knownDiceCount" class="dice-count-label"></span>
            </div>
            <ul id="knownDiceList" class="known-dice-list"></ul>
          </div>
          <button id="connect" class="primary-button">Connect to Pixel</button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

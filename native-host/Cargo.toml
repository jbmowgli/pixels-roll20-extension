[package]
name = "pixels-roll20-helper"
version = "0.1.0"
edition = "2021"
description = "Native messaging host bridging Pixels dice Bluetooth notifications to the Pixels Roll20 browser extension (Firefox)."
license = "MIT"
publish = false

[[bin]]
name = "pixels-roll20-helper"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
futures = "0.3"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
